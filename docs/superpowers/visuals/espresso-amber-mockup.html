<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espresso Amber Mockup</title>
    <style>
      :root {
        --bg-ink: #120f0c;
        --bg-espresso: #1b1511;
        --bg-roast: #241b15;
        --bg-elevated: #2b2018;
        --edge-bronze: rgba(194, 150, 97, 0.25);
        --edge-soft: rgba(246, 229, 207, 0.08);
        --text-cream: #f3e8d9;
        --text-muted: #c4b39a;
        --text-dim: #8d7c66;
        --accent-amber: #d39b5f;
        --accent-brass: #b77b3f;
        --accent-ember: #cc6b4a;
        --glow-amber: rgba(211, 155, 95, 0.18);
        --glow-ember: rgba(204, 107, 74, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "Poppins", "Noto Sans", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 20% -20%, rgba(211, 155, 95, 0.2), transparent 60%),
                    radial-gradient(900px 500px at 90% 10%, rgba(204, 107, 74, 0.18), transparent 60%),
                    var(--bg-ink);
        color: var(--text-cream);
      }

      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.06;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.4"/></svg>');
        mix-blend-mode: soft-light;
      }

      .frame {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: rgba(27, 21, 17, 0.85);
        border: 1px solid var(--edge-soft);
        box-shadow: 0 18px 50px rgba(0,0,0,0.45);
        border-radius: 18px;
        backdrop-filter: blur(18px);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-badge {
        height: 42px;
        width: 42px;
        border-radius: 14px;
        background: linear-gradient(140deg, rgba(211,155,95,0.25), rgba(183,123,63,0.6));
        border: 1px solid rgba(211,155,95,0.35);
        display: grid;
        place-items: center;
        color: var(--text-cream);
        font-weight: 700;
      }

      .logo-text h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.02em;
      }

      .logo-text span {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--edge-soft);
        background: rgba(27, 21, 17, 0.5);
        color: var(--text-muted);
        font-size: 11px;
      }

      .cta {
        padding: 10px 16px;
        border-radius: 999px;
        background: linear-gradient(140deg, var(--accent-amber), var(--accent-brass));
        color: #1a100a;
        font-weight: 600;
        font-size: 12px;
        border: none;
      }

      .hero {
        margin-top: 36px;
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 28px;
        align-items: center;
      }

      .hero-card {
        background: rgba(27, 21, 17, 0.85);
        border: 1px solid var(--edge-soft);
        border-radius: 24px;
        padding: 26px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      }

      .hero-card h2 {
        margin: 0 0 12px;
        font-size: 26px;
      }

      .hero-card p {
        margin: 0 0 20px;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .search {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
        padding: 12px;
        background: rgba(18, 15, 12, 0.85);
        border-radius: 16px;
        border: 1px solid var(--edge-bronze);
      }

      .search input {
        background: rgba(36, 27, 21, 0.75);
        border: 1px solid rgba(246, 229, 207, 0.08);
        color: var(--text-cream);
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12px;
      }

      .search button {
        padding: 10px 16px;
        border-radius: 12px;
        border: none;
        background: var(--accent-amber);
        color: #1b120c;
        font-weight: 600;
      }

      .map-card {
        height: 360px;
        border-radius: 24px;
        border: 1px solid var(--edge-soft);
        background: linear-gradient(160deg, rgba(27, 21, 17, 0.9), rgba(18, 15, 12, 0.9));
        box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
        position: relative;
        overflow: hidden;
      }

      .map-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(211,155,95,0.08) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.4;
      }

      .map-outline {
        position: absolute;
        inset: 60px 40px;
        border: 1px dashed rgba(211,155,95,0.35);
        border-radius: 50%;
      }

      .map-pin {
        position: absolute;
        width: 8px;
        height: 8px;
        background: var(--accent-ember);
        border-radius: 50%;
        box-shadow: 0 0 16px var(--glow-ember);
      }

      .pin-1 { top: 120px; left: 120px; }
      .pin-2 { top: 190px; right: 140px; }
      .pin-3 { bottom: 90px; left: 260px; }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      .stat {
        background: rgba(36, 27, 21, 0.6);
        border: 1px solid rgba(246, 229, 207, 0.08);
        padding: 14px;
        border-radius: 16px;
      }

      .stat span {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
      }

      .stat strong {
        font-size: 18px;
      }

      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div class="frame">
      <div class="nav">
        <div class="logo">
          <div class="logo-badge">M</div>
          <div class="logo-text">
            <h1>Dream Music Map</h1>
            <span>DISCOVERY MODE</span>
          </div>
        </div>
        <div class="nav-actions">
          <div class="pill">MAP</div>
          <div class="pill">SHELF</div>
          <button class="cta">Add Record</button>
        </div>
      </div>

      <section class="hero">
        <div class="hero-card">
          <h2>Espresso Amber Atmosphere</h2>
          <p>Deep espresso grounds, amber highlights, and brass UI accents for a timeless vinyl studio feel.</p>
          <div class="search">
            <input placeholder="Search artist" />
            <input placeholder="Search album" />
            <button>Search</button>
          </div>
          <div class="stats">
            <div class="stat"><span>Records</span><strong>2,418</strong></div>
            <div class="stat"><span>Regions</span><strong>52</strong></div>
            <div class="stat"><span>Decades</span><strong>7</strong></div>
          </div>
        </div>
        <div class="map-card">
          <div class="map-grid"></div>
          <div class="map-outline"></div>
          <div class="map-pin pin-1"></div>
          <div class="map-pin pin-2"></div>
          <div class="map-pin pin-3"></div>
        </div>
      </section>
    </div>
  </body>
</html>
