services:
  app:
    image: ${APP_IMAGE:-crpi-i0wu5sd5futj2oji.cn-guangzhou.personal.cr.aliyuncs.com/chenzczczc/dream:latest}
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      LOCAL_DB_PATH: /app/data/dream.db
      COVER_CACHE_DIR: /app/data/covers
      LOCAL_DEFAULT_USER_ID: ${LOCAL_DEFAULT_USER_ID:-local-user}
      LOCAL_DEFAULT_USER_EMAIL: ${LOCAL_DEFAULT_USER_EMAIL:-local@localhost}
      NEXT_PUBLIC_LOCAL_DEFAULT_USER_EMAIL: ${NEXT_PUBLIC_LOCAL_DEFAULT_USER_EMAIL:-local@localhost}
      NEXT_PUBLIC_LOCAL_DEFAULT_USER_ID: ${NEXT_PUBLIC_LOCAL_DEFAULT_USER_ID:-local-user}
      DISCOVERY_ADMIN_EMAILS: ${DISCOVERY_ADMIN_EMAILS:-local@localhost}
      NEXT_PUBLIC_FORCE_DEFAULT_AUTH: ${NEXT_PUBLIC_FORCE_DEFAULT_AUTH:-false}
      MUSIC_APP_NAME: personal-music-geography
      MUSIC_APP_VERSION: 0.1.0
      MUSIC_APP_CONTACT: local-dev
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      MUSICBRAINZ_TOKEN: ${MUSICBRAINZ_TOKEN:-}
      MUSICBRAINZ_TOKENS: ${MUSICBRAINZ_TOKENS:-}
      NETEASE_API_BASE_URL: ${NETEASE_API_BASE_URL:-http://netease-api:3000}
    volumes:
      - ./data:/app/data
      - ./data/covers:/app/public/covers
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /app/data /app/data/covers /app/public/covers
        touch /app/data/.write-test && rm -f /app/data/.write-test
        touch /app/public/covers/.write-test && rm -f /app/public/covers/.write-test
        exec node server.js
    restart: unless-stopped

  netease-api:
    image: ${NETEASE_API_IMAGE:-moefurina/ncm-api:latest}
    pull_policy: always
    ports:
      - "3001:3000"
    environment:
      - HTTP_PROXY=${NETEASE_HTTP_PROXY:-}
      - HTTPS_PROXY=${NETEASE_HTTPS_PROXY:-}
      - ALL_PROXY=${NETEASE_ALL_PROXY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
